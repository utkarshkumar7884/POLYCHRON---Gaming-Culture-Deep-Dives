<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="sbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <linearGradient id="goldline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sbg)"/>
  <!-- Musical Staff Lines -->
  <g stroke="#57534e" stroke-width="1.5" opacity="0.5">
    <line x1="80" y1="150" x2="720" y2="150"/>
    <line x1="80" y1="180" x2="720" y2="180"/>
    <line x1="80" y1="210" x2="720" y2="210"/>
    <line x1="80" y1="240" x2="720" y2="240"/>
    <line x1="80" y1="270" x2="720" y2="270"/>
  </g>
  <!-- Adaptive Waveform Ribbon over staff -->
  <path d="M 80 210 Q 180 90 280 210 T 480 210 T 680 210" fill="none" stroke="url(#goldline)" stroke-width="4"/>
  <path d="M 100 210 Q 200 320 320 210 T 520 210 T 700 210" fill="none" stroke="#e11d48" stroke-width="2" opacity="0.6"/>
  <!-- Cello Body Outline & Musical Notes -->
  <g stroke="#d97706" fill="none" stroke-width="2" opacity="0.7">
    <path d="M 380 120 C 350 160 410 200 370 260 C 340 300 460 300 430 260 C 390 200 450 160 420 120 Z" fill="#78350f" fill-opacity="0.3"/>
    <line x1="400" y1="90" x2="400" y2="320" stroke="#fbbf24" stroke-width="2.5"/>
  </g>
  <!-- Stem Layers -->
  <g fill="#f59e0b" font-family="monospace" font-size="11">
    <rect x="120" y="320" width="120" height="24" rx="4" fill="#451a03" stroke="#d97706"/>
    <text x="180" y="336" text-anchor="middle" fill="#fef3c7">STEM 1: CELLO</text>
    <rect x="260" y="320" width="140" height="24" rx="4" fill="#4c0519" stroke="#e11d48"/>
    <text x="330" y="336" text-anchor="middle" fill="#ffe4e6">STEM 2: SYNTH</text>
    <rect x="420" y="320" width="140" height="24" rx="4" fill="#292524" stroke="#78716c"/>
    <text x="490" y="336" text-anchor="middle" fill="#e7e5e4">STEM 3: DRUMS</text>
  </g>
  <text x="400" y="400" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fbbf24" letter-spacing="4" text-anchor="middle">VERTICAL STEM MIXING &amp; ADAPTIVE LEITMOTIFS</text>
</svg>