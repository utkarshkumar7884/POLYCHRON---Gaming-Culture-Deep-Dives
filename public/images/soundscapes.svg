<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Soundwave grid -->
  <g opacity="0.25" stroke="#a1a1aa" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="450" stroke-dasharray="4,8"/>
    <line x1="300" y1="0" x2="300" y2="450" stroke-dasharray="4,8"/>
    <line x1="500" y1="0" x2="500" y2="450" stroke-dasharray="4,8"/>
    <line x1="700" y1="0" x2="700" y2="450" stroke-dasharray="4,8"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
  </g>
  <!-- Architectural Room Nodes -->
  <circle cx="220" cy="225" r="80" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.4"/>
  <circle cx="220" cy="225" r="140" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.3"/>
  <circle cx="580" cy="225" r="90" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>
  <circle cx="580" cy="225" r="160" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.2"/>
  <!-- Raytraced sound pulse paths -->
  <path d="M 100 225 Q 220 120 340 225 T 580 225 T 750 225" fill="none" stroke="url(#wave)" stroke-width="4"/>
  <path d="M 120 225 Q 220 310 360 225 T 580 225 T 720 225" fill="none" stroke="url(#wave)" stroke-width="2" opacity="0.7"/>
  <!-- Frequency Bars -->
  <g fill="#a78bfa" opacity="0.85">
    <rect x="360" y="165" width="6" height="120" rx="3"/>
    <rect x="375" y="145" width="6" height="160" rx="3"/>
    <rect x="390" y="120" width="6" height="210" rx="3" fill="#c084fc"/>
    <rect x="405" y="150" width="6" height="150" rx="3" fill="#f472b6"/>
    <rect x="420" y="175" width="6" height="100" rx="3"/>
    <rect x="435" y="195" width="6" height="60" rx="3"/>
  </g>
  <text x="400" y="390" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e4e4e7" letter-spacing="4" text-anchor="middle">ACOUSTIC PORTALING &amp; OCCLUSION</text>
</svg>