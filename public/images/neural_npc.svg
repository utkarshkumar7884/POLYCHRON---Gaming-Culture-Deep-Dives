<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="nbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#nbg)"/>
  <!-- Neural Mesh Nodes & Memory Connections -->
  <g stroke="#34d399" stroke-width="1.5" opacity="0.5">
    <line x1="200" y1="150" x2="320" y2="100"/>
    <line x1="200" y1="150" x2="320" y2="220"/>
    <line x1="200" y1="300" x2="320" y2="220"/>
    <line x1="200" y1="300" x2="320" y2="340"/>
    <line x1="320" y1="100" x2="480" y2="160"/>
    <line x1="320" y1="220" x2="480" y2="160"/>
    <line x1="320" y1="220" x2="480" y2="280"/>
    <line x1="320" y1="340" x2="480" y2="280"/>
    <line x1="480" y1="160" x2="600" y2="220"/>
    <line x1="480" y1="280" x2="600" y2="220"/>
  </g>
  <!-- Nodes -->
  <g fill="#10b981" stroke="#a7f3d0" stroke-width="2">
    <circle cx="200" cy="150" r="10"/>
    <circle cx="200" cy="300" r="10"/>
    <circle cx="320" cy="100" r="12" fill="#059669"/>
    <circle cx="320" cy="220" r="15" fill="#34d399"/>
    <circle cx="320" cy="340" r="12" fill="#059669"/>
    <circle cx="480" cy="160" r="14" fill="#34d399"/>
    <circle cx="480" cy="280" r="14" fill="#059669"/>
    <circle cx="600" cy="220" r="18" fill="#6ee7b7"/>
  </g>
  <!-- Memory Graph Vector Labels -->
  <g fill="#a7f3d0" font-family="monospace" font-size="11">
    <text x="130" y="145">FACTION</text>
    <text x="145" y="295">HUNGER</text>
    <text x="340" y="95">REPUTATION_LOG</text>
    <text x="345" y="215">EMPATHY_WEIGHT</text>
    <text x="500" y="155">INTENT_TOKEN</text>
    <text x="630" y="225" font-size="13" font-weight="bold" fill="#ecfdf5">AUTONOMOUS_ACT</text>
  </g>
  <text x="400" y="400" font-family="sans-serif" font-size="14" font-weight="bold" fill="#6ee7b7" letter-spacing="4" text-anchor="middle">BEHAVIOR TREES &amp; LOCAL MEMORY GRAPHS</text>
</svg>