<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="rbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180828"/>
      <stop offset="100%" stop-color="#080210"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#rbg)"/>
  <!-- Circular Rune / Portal -->
  <circle cx="400" cy="210" r="160" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.3" stroke-dasharray="8,8"/>
  <circle cx="400" cy="210" r="120" fill="none" stroke="#eab308" stroke-width="1" opacity="0.4"/>
  <!-- Floating Joker / Tarot Cards in isometric fan -->
  <!-- Left Card -->
  <g transform="translate(250, 140) rotate(-14)">
    <rect width="110" height="160" rx="10" fill="#2e1065" stroke="#a855f7" stroke-width="2"/>
    <rect x="10" y="10" width="90" height="140" rx="6" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.5"/>
    <circle cx="55" cy="65" r="25" fill="#7e22ce" opacity="0.5"/>
    <text x="55" y="120" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f3e8ff" text-anchor="middle">ANTE +1</text>
  </g>
  <!-- Center Card (Hero) -->
  <g transform="translate(345, 110)">
    <rect width="110" height="160" rx="10" fill="#451a03" stroke="url(#gold)" stroke-width="2.5"/>
    <rect x="8" y="8" width="94" height="144" rx="6" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.6"/>
    <polygon points="55,40 75,75 35,75" fill="#f59e0b"/>
    <text x="55" y="110" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fef08a" text-anchor="middle">MULT x4</text>
    <text x="55" y="135" font-family="sans-serif" font-size="11" fill="#fed7aa" text-anchor="middle">SYNERGY</text>
  </g>
  <!-- Right Card -->
  <g transform="translate(440, 140) rotate(14)">
    <rect width="110" height="160" rx="10" fill="#3b0764" stroke="#c084fc" stroke-width="2"/>
    <rect x="10" y="10" width="90" height="140" rx="6" fill="none" stroke="#e9d5ff" stroke-width="1" opacity="0.5"/>
    <circle cx="55" cy="65" r="20" fill="#9333ea" opacity="0.4"/>
    <text x="55" y="120" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f3e8ff" text-anchor="middle">RE-ROLL</text>
  </g>
  <text x="400" y="390" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fbbf24" letter-spacing="4" text-anchor="middle">VARIABLE RATIO REWARD SCHEDULE</text>
</svg>