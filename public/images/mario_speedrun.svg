<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="mbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#mbg)"/>
  <!-- N64 Grid Wireframe Stairs -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.4">
    <path d="M 100 360 L 220 360 L 220 300 L 340 300 L 340 240 L 460 240 L 460 180 L 580 180 L 580 120 L 700 120" fill="none"/>
  </g>
  <!-- Backward Long Jump Speed Trail -->
  <path d="M 650 140 Q 480 200 300 280 T 150 350" fill="none" stroke="#ef4444" stroke-width="4" opacity="0.9"/>
  <path d="M 650 140 Q 480 200 300 280 T 150 350" fill="none" stroke="#facc15" stroke-width="2" stroke-dasharray="12,8"/>
  <!-- Mario Cap / Silhouette Geometry -->
  <g transform="translate(280, 240)">
    <ellipse cx="30" cy="25" rx="28" ry="16" fill="#dc2626"/>
    <rect x="30" y="22" width="28" height="8" rx="4" fill="#b91c1c"/>
    <circle cx="24" cy="20" r="8" fill="#ffffff"/>
    <text x="24" y="24" font-family="sans-serif" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="middle">M</text>
  </g>
  <!-- Negative Velocity Vector Telemetry -->
  <g fill="#38bdf8" font-family="monospace" font-size="13">
    <text x="480" y="80">VELOCITY: -16384.00 u/s</text>
    <text x="480" y="105" fill="#ef4444">SUB-FRAME CHECK: TRUE</text>
    <text x="480" y="130" fill="#facc15">PU COORDINATE: [x:0, y:4, z:0]</text>
  </g>
  <text x="400" y="400" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc" letter-spacing="4" text-anchor="middle">DECONSTRUCTING 64-BIT SUB-FRAME GLITCHES</text>
</svg>