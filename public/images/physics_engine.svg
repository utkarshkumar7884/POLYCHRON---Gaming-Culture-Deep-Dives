<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="pbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#pbg)"/>
  <!-- Isometric Physics Grid -->
  <g stroke="#1e293b" stroke-width="1.5" opacity="0.8">
    <line x1="100" y1="350" x2="400" y2="450"/>
    <line x1="400" y1="450" x2="700" y2="350"/>
    <line x1="200" y1="300" x2="500" y2="400"/>
    <line x1="300" y1="250" x2="600" y2="350"/>
  </g>
  <!-- Wireframe Rigid Body Cubes & Stress vectors -->
  <g fill="none" stroke="url(#neon)" stroke-width="2.5">
    <!-- Main Center Cube -->
    <polygon points="400,120 480,165 480,260 400,215" fill="#0891b2" fill-opacity="0.15"/>
    <polygon points="400,120 320,165 320,260 400,215" fill="#0e7490" fill-opacity="0.25"/>
    <polygon points="400,120 480,165 400,210 320,165" fill="#22d3ee" fill-opacity="0.35"/>
  </g>
  <!-- Stress fracture lines -->
  <path d="M 400 120 L 420 180 L 380 200 L 400 260" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
  <circle cx="420" cy="180" r="5" fill="#f59e0b"/>
  <circle cx="380" cy="200" r="5" fill="#f59e0b"/>
  <!-- Orbiting collision particles -->
  <g fill="#38bdf8">
    <circle cx="260" cy="150" r="4" opacity="0.8"/>
    <circle cx="540" cy="140" r="6" opacity="0.9"/>
    <circle cx="510" cy="280" r="3.5" opacity="0.7"/>
    <circle cx="280" cy="270" r="5" opacity="0.8"/>
    <line x1="480" y1="165" x2="540" y2="140" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="320" y1="260" x2="280" y2="270" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>
  <text x="400" y="390" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38bdf8" letter-spacing="4" text-anchor="middle">RIGID BODY DYNAMICS &amp; VOLUMETRIC FEM</text>
</svg>